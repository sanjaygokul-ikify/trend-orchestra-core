[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "orchestra-core"
version = "0.1.0"
description = "Orchestration framework for autonomous agent swarms"
authors = ["[AI Author] <team@orchestra.core>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.10"
asyncpg = "^0.24.0"
greenthreads = "^1.5.0"
vectorhub = "^0.9.0"
raft = "^1.2.8"

[tool.poetry.dev-dependencies]
types-asyncpg = "^0.24.0"
pytest = "^7.1.2"
typeguard = "^4.1.2"
